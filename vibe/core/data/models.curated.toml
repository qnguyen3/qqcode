# Built-in model catalog. The source of vibe/core/data/models.generated.json.
# Edit this file, then run: uv run python scripts/generate_models.py
#
# A provider with an upstream catalog (models.dev, OpenRouter, Vercel AI
# Gateway) takes context window, pricing and reasoning metadata from it. Fields
# written here override it. An entry with manual = true has no upstream source,
# so it must state context_window and pricing itself.
#
# A [[catalog]] rule builds every active, tool-capable model that models.dev
# lists for its provider, as a "provider/name" alias. A [[models]] entry with
# the same provider and name replaces the generated one. exclude drops names.

[[catalog]]
provider = "xiaomimimo"

[[catalog]]
provider = "deepseek"

[[catalog]]
provider = "opencode"
exclude = ["gpt-5.3-codex-spark", "claude-sonnet-4", "deepseek-v4-flash-vision-exp", "nemotron-3-ultra-free"]  # models.dev lists these, but neither zen/v1 nor zen/go/v1 serves them

[[catalog]]
provider = "opencode-go"
exclude = ["gpt-5.3-codex-spark", "gemini-4-argon-contributor"]  # no Go route: 404 on the Google protocol, rejected on chat completions

[[models]]
provider = "mistral"
name = "mistral-vibe-cli-latest"
alias = "devstral-2"
manual = true
context_window = 200000

[models.capabilities]
tools = true
